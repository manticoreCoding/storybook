name: Deploy and Update Notion Version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Manual Version Tag'
        required: true
        default: 'v1.0.0'

jobs:
  deploy-and-notify:
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.inputs.version_tag || github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Simulate Deployment Step
        run: |
          echo "Deploying production build..."
          echo "Deployment successful."

      - name: Show the version we were given
        run: echo "Version tag is $VERSION_TAG"

      - name: Update Version Tag in Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ROW_ID: ${{ vars.NOTION_ROW_ID }}
        run: |
          FORMATTED_ROW_ID=$(echo $NOTION_ROW_ID | sed -E 's/(.{8})(.{4})(.{4})(.{4})(.{12})/\1-\2-\3-\4-\5/')
          echo "Updating Notion row $FORMATTED_ROW_ID with version $VERSION_TAG"

          curl --fail-with-body -X PATCH "https://api.notion.com/v1/pages/${FORMATTED_ROW_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            --data '{
              "properties": {
                "Version": {
                  "rich_text": [ { "text": { "content": "'"${VERSION_TAG}"'" } } ]
                },
                "Last Deployed": {
                  "date": { "start": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'" }
                }
              }
            }'

